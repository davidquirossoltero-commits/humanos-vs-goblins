server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El preset Web del proyecto exporta SIN hilos (thread_support=false).
    # No hacen falta Cross-Origin-Opener-Policy ni Cross-Origin-Embedder-Policy.
    # .wasm tiene que anunciarse con el tipo correcto o el navegador no lo carga.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.pck$ {
        default_type application/octet-stream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Si reexportas el juego CON hilos (thread_support=true), descomenta estas
    # dos cabeceras. Tienen que ir en TODAS las respuestas del sitio, si no
    # SharedArrayBuffer no se activa y el juego no arranca.
    # add_header Cross-Origin-Opener-Policy same-origin always;
    # add_header Cross-Origin-Embedder-Policy require-corp always;

    gzip on;
    gzip_types text/css application/javascript application/wasm application/octet-stream image/svg+xml;
    gzip_min_length 1024;
}
